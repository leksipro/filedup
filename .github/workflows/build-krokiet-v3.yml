
    
  
name: Build Krokiet v3 (macOS ARM64)

"on":
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-krokiet-v3.yml'
      - 'krokiet_folder_compare_patch_12.0.2_v3.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: |
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Install Rust stable (minimal)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Get Krokiet 12.0.2 and apply patch
        run: |
          test -f krokiet_folder_compare_patch_12.0.2_v3.zip
          unzip -q krokiet_folder_compare_patch_12.0.2_v3.zip
          git clone --depth 1 --branch 12.0.2 https://github.com/qarmin/czkawka.git czkawka
          python3 krokiet_folder_compare_patch/apply_patch.py czkawka

      - name: Run Folder Compare tests
        working-directory: czkawka
        run: cargo test -p krokiet folder_compare --locked --target aarch64-apple-darwin

      - name: Free debug build space
        run: rm -rf czkawka/target/aarch64-apple-darwin/debug

      - name: Build Krokiet release
        working-directory: czkawka
        run: cargo build -p krokiet --release --locked --target aarch64-apple-darwin

      - name: Package macOS executable and verifier
        run: |
          mkdir -p dist
          cp czkawka/target/aarch64-apple-darwin/release/krokiet dist/krokiet
          cp krokiet_folder_compare_patch/verify_folders.py dist/verify_folders.py
          cp krokiet_folder_compare_patch/README_DE.md dist/README_DE.md
          chmod +x dist/krokiet
          cd dist
          zip -q krokiet-v3-macos-arm64.zip krokiet verify_folders.py README_DE.md

      - name: Upload compiled program
        uses: actions/upload-artifact@v4
        with:
          name: krokiet-v3-macos-arm64
          path: dist/krokiet-v3-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7

