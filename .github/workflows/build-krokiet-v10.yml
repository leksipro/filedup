name: Build Krokiet v10 (macOS ARM64)
on:
  workflow_dispatch:
  push:
    paths:
      - 'krokiet_folder_compare_patch_12.0.2_v10.zip'
      - '.github/workflows/build-krokiet-v10.yml'
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify runner architecture
        run: |
          uname -m
          test "$(uname -m)" = "arm64"
      - name: Unpack v10 add-on
        run: |
          test -f krokiet_folder_compare_patch_12.0.2_v10.zip
          unzip -q krokiet_folder_compare_patch_12.0.2_v10.zip -d patch
          test -f patch/krokiet_folder_compare_patch/apply_patch.py
      - name: Python verifier regression tests
        run: python3 -m unittest discover -s patch/krokiet_folder_compare_patch/tests -v
      - name: Clone original Krokiet 12.0.2
        run: git clone --depth 1 --branch 12.0.2 https://github.com/qarmin/czkawka.git czkawka
      - name: Apply v10 patch
        run: python3 patch/krokiet_folder_compare_patch/apply_patch.py "$GITHUB_WORKSPACE/czkawka"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Run complete Krokiet tests (including manual merge)
        working-directory: czkawka
        run: cargo test -p krokiet --locked --target aarch64-apple-darwin
      - name: Free test/debug build space before release
        run: |
          rm -rf czkawka/target/aarch64-apple-darwin/debug
          rm -rf czkawka/target/debug
      - name: Build Krokiet release
        working-directory: czkawka
        run: cargo build -p krokiet --release --locked --target aarch64-apple-darwin
      - name: Package binary, instructions and verifier
        run: |
          mkdir -p dist
          cp czkawka/target/aarch64-apple-darwin/release/krokiet dist/krokiet
          cp patch/krokiet_folder_compare_patch/verify_folders.py dist/verify_folders.py
          cp patch/krokiet_folder_compare_patch/README_DE.md dist/README_DE.md
          chmod +x dist/krokiet
          file dist/krokiet
          lipo -archs dist/krokiet | grep -qw arm64
          (cd dist && shasum -a 256 krokiet > SHA256SUMS.txt)
      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: krokiet-v10-macos-arm64
          path: dist/
          if-no-files-found: error
